services:
  - type: web
    name: crediclass-dashboard-v3
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -m nodeenv --node=24.14.1 --prebuilt backend/pdf_service/.nodeenv && backend/pdf_service/.nodeenv/bin/npm install --prefix backend/pdf_service --omit=dev
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --no-access-log --timeout-keep-alive 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ENVIRONMENT
        value: production
      - key: APP_VERSION
        value: 4.0.104
      - key: NODE_VERSION
        value: 24.14.1
      - key: DEBUG
        value: "false"
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_NAME
        sync: false
