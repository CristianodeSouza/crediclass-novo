<text x="1168.25" y="1041.86" font-family="EFOpenSans" font-size="26.29" fill="#ffffff" font-weight="700" textLength="483.82" lengthAdjust="spacing">SIMULAÇÃO MELHORES CONSÓRCIOS</text>
<text x="1153.94" y="1102.43" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="320.38" lengthAdjust="spacing">Administradora selecionada:</text>
<text x="1480.87" y="1102.43" font-family="EFOpenSans" font-size="24" fill="#000000" font-weight="700" textLength="185.52" lengthAdjust="spacing">Itaú Consórcios</text>
<text x="921.34" y="1371.05" font-family="EFOpenSans" font-size="24" fill="#000000" font-weight="700" textLength="242.04" lengthAdjust="spacing">Critérios de seleção:</text>
<text x="1248.25" y="1179.03" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1405.56" lengthAdjust="spacing">Os grupos apresentados foram selecionados a partir de critérios técnicos definidos pela Crediclass, considerando indicadores</text>
<text x="1248.25" y="1213.88" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="595.54" lengthAdjust="spacing">históricos e condições disponíveis na data da análise.</text>
<text x="1248.25" y="1283.6" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="984.11" lengthAdjust="spacing">1 - Grupos antigos: mais participantes já contemplados, menor concorrência nos lances;</text>
<text x="1248.25" y="1353.34" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1155.07" lengthAdjust="spacing">2 - Histórico de lance: concorrencia de lances abaixo da média mercado para grupos com prazo similar;</text>
<text x="1248.25" y="1423.05" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1092.74" lengthAdjust="spacing">3 - Estabilidade nos lances: menor volatilidade nos últimos 11 meses, o que traz maior segurança;</text>
<text x="1248.25" y="1492.79" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1192.7" lengthAdjust="spacing">4 - Saúde financeira: grupos saudáveis, contemplaram em média 25 cartas por mês, nos últimos 11 meses;</text>
<text x="1248.25" y="1562.51" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1113.63" lengthAdjust="spacing">5 - Lance embutido: permite utilizar até 30% da carta de crédito para pagamento do lance ofertado;</text>
<text x="581.27" y="1711.67" font-family="EFOpenSans" font-size="24" fill="#000000" font-weight="700" textLength="187.87" lengthAdjust="spacing">Como funciona:</text>
<text x="1248.25" y="1641.93" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1440.17" lengthAdjust="spacing">O consórcio é uma modalidade de crédito planejado que permite a aquisição de imóveis e outros bens por meio da formação de</text>
<text x="1248.25" y="1676.82" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="427.7" lengthAdjust="spacing">um fundo comum entre participantes.</text>
<text x="1248.25" y="1746.53" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1344.17" lengthAdjust="spacing">Mensalmente, são realizadas contemplações por sorteio e lance, possibilitando o acesso à carta de crédito e oferecendo</text>
<text x="1248.25" y="1781.39" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="570.17" lengthAdjust="spacing">flexibilidade para diferentes objetivos patrimoniais</text>
<text x="526.96" y="1965.41" font-family="EFOpenSans" font-size="24" fill="#000000" font-weight="700" textLength="296.78" lengthAdjust="spacing">Contemplações Mensais:</text>
<text x="1462.01" y="1995.7" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1221.94" lengthAdjust="spacing">Modalidade que permite ofertar qualquer valor de lance. São contempladas as cartas com as maiores ofertas</text>
<text x="1462.01" y="2030.58" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1216.49" lengthAdjust="spacing">com multiplos ganhadores mensalmente.  É utilizada pelos consorciados que desejam acessar a sua carta de</text>
<text x="1462.01" y="2065.44" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="375.1" lengthAdjust="spacing">crédito sem depender do sorteio.</text>
<text x="530.39" y="2203.75" font-family="EFOpenSans" font-size="24" fill="#000000" font-weight="700" textLength="290.64" lengthAdjust="spacing">Uso do Carta de Crédito:</text>

<text x="1220.25" y="90.88" font-family="EFCalibri" font-size="24" fill="#b5b3b3" textLength="393.1" lengthAdjust="spacing">Estudo Financeiro | Aquisição de Imóvel</text>
<text x="844.75" y="421.19" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1356.22" lengthAdjust="spacing">Consultoria de lances para estratégias assertivas, apoio operacional em oferta e acompanhamento resultado assembleia.</text>
<text x="844.75" y="492.64" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1642.75" lengthAdjust="spacing">Tramites com a administradora, vendedores, prefeitura, cartório de imóveis, certidões, contrato de compromisso de venda e compra, entre outros.</text>
<text x="110.31" y="648.67" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1932.7" lengthAdjust="spacing">- Grupos em andamento, com ótima saúde financeira, grande quantidade de contemplações por mês, facilitando a liberação de  todas as cartas para utilização rapidamente;</text>
<text x="110.31" y="685.24" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="773.83" lengthAdjust="spacing">- As contemplações ocorrem todos os meses: Sorteio e Lances Livres;</text>
<text x="110.31" y="721.81" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="745.18" lengthAdjust="spacing">- É possível utilizar até 30% do crédito para pagar o lance ofertado;</text>
<text x="110.31" y="758.38" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1071.26" lengthAdjust="spacing">- É permitido reduzir 100% do lance no valor da parcela para obter o menor custo/mês possível;</text>
<text x="110.31" y="794.98" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="2141.83" lengthAdjust="spacing">- A correção das cartas de créditos ocorre anualmente pelo INCC (Índice Nacional da Construção Civil) para manutenção do poder de compra das cartas de crédito do grupo frente ao mercado;</text>
<text x="110.31" y="831.55" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1392.98" lengthAdjust="spacing">- Fundo de reserva: 2% em média no total, diluído no prazo do grupo. Saldo remanescente é devolvido no término do grupo;</text>
<text x="110.31" y="868.12" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1197.48" lengthAdjust="spacing">- Seguro prestamista 0,06% sob o saldo devedor - opcional; a simulação não contempla inclusão do seguro.</text>
<text x="110.31" y="904.69" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="574.99" lengthAdjust="spacing">- Débito automático das prestações em contas Itaú.</text>

<text x="110.31" y="1676.82" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1827.96" lengthAdjust="spacing">Para sua comodidade, oferecemos o serviço de consultoria, oferta de lance e acompanhamento mensal de contemplação, conforme as estratégia sugeridas abaixo:</text>

<text x="110.31" y="1781.39" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1446.17" lengthAdjust="spacing">-&gt; Sorteio + Lance Fixo 40% (será ofertado o lance fixo de 40%, modalidade com menor desembolso, visando maior alavancagem)</text>

<text x="110.31" y="1885.98" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="21.73" lengthAdjust="spacing">-&gt;</text>
<text x="138.31" y="1885.98" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1357.32" lengthAdjust="spacing">Sorteio + Lance Livre Conservador (será ofertado um lance que teria sido contemplado em 1 das últimas 11 assembleias).</text>
<text x="110.31" y="1955.7" font-family="EFOpenSans" font-size="24" fill="#000000" font-weight="700" textLength="149.11" lengthAdjust="spacing">Estratégia 3)</text>
<text x="265.72" y="1955.7" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="115.58" lengthAdjust="spacing">Moderada</text>
<text x="110.31" y="1990.55" font-family="EFOpenSans" font-size="24" fill="#000000" textLength="1358.95" lengthAdjust="spacing">-&gt; Sorteio + Lance Livre Moderado (será ofertado um lance que teria sido contemplado em 2 das últimas 11 assembleias).</text>

<text x="110.88" y="364.05" font-family="EFOpenSans" font-size="26.29" fill="#000000" font-weight="700" textLength="359.22" lengthAdjust="spacing">Considerações Importantes</text>
<text x="110.88" y="432.07" font-family="EFOpenSans" font-size="26.29" fill="#000000" textLength="2237.36" lengthAdjust="spacing">Os cenários, projeções e simulações apresentados neste estudo foram elaborados com base nas informações fornecidas pelo cliente e nas condições observadas na data de emissão.</text>
<text x="110.88" y="500.64" font-family="EFOpenSans" font-size="26.29" fill="#000000" textLength="2575.82" lengthAdjust="spacing">Os resultados demonstrados possuem caráter exclusivamente informativo e ilustrativo, podendo sofrer alterações em decorrência de fatores econômicos, financeiros, regulatórios, operacionais ou de mercado.</text>
<text x="110.88" y="569.21" font-family="EFOpenSans" font-size="26.29" fill="#000000" textLength="2139.44" lengthAdjust="spacing">A Crediclass não garante rentabilidade de investimentos, índices de correção futuros, percentuais de contemplação, prazos de contemplação ou quaisquer resultados futuros.</text>
<text x="110.88" y="637.81" font-family="EFOpenSans" font-size="26.29" fill="#000000" textLength="2602.37" lengthAdjust="spacing">A decisão pela contratação de qualquer produto financeiro ou estratégia patrimonial é de responsabilidade exclusiva do cliente, que deverá avaliar sua adequação aos seus objetivos, necessidades e perfil financei</text>
