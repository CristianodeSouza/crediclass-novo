name: Motor 360 regression suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt
      - name: Install PDF service test dependencies
        run: npm ci --prefix backend/pdf_service
      - name: Run complete unit and integration suite
        env:
          REQUIRE_MOTOR360_BROWSER: "1"
        run: python -m unittest discover -s tests -v
